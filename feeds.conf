# Threat feeds to convert into UniFi lists. One URL per line.
#
# A bare URL is enough. The build downloads it and works out the rest:
#   format   JSON, plain list, CSV, start-end ranges, hosts file, adblock
#            rules, dnsmasq rules, or a list of URLs
#   type     IPv4, IPv6 or domains (one output file per type)
#   group    core for lists of networks, inbound for lists of single hosts,
#            domains for domain lists
#   name     taken from the URL
#
# Any of that can be pinned after the URL:
#   name=spamhaus-drop     output prefix: lists/<name>-v4.txt and so on.
#                          Lines sharing a name are merged into one feed.
#   group=core             core, inbound, or none (publish on its own only)
#   format=range           text, range or json, if detection gets it wrong
#
# Put a # in front of a line to turn that feed off. Do not add URLs that
# contain an API key: this file is public.

# Networks run by or leased to criminal operations. These land in "core".
https://www.spamhaus.org/drop/drop_v4.json                         name=spamhaus-drop
https://www.spamhaus.org/drop/drop_v6.json                         name=spamhaus-drop
https://iplists.firehol.org/files/firehol_level1.netset            name=firehol-level1
https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt   name=et-block-ips
https://feeds.dshield.org/block.txt                                name=dshield

# Botnet command servers. Single hosts, so detection would file this under
# inbound, but the point is to stop LAN clients reaching them.
https://feodotracker.abuse.ch/downloads/ipblocklist.txt            name=feodo-tracker  group=core

# Hosts seen scanning or brute-forcing. These land in "inbound".
https://raw.githubusercontent.com/stamparm/ipsum/master/levels/3.txt     name=ipsum-level3
https://lists.blocklist.de/lists/all.txt                                 name=blocklist-de
https://cinsscore.com/list/ci-badguys.txt                                name=cins-army
https://rules.emergingthreats.net/blockrules/compromised-ips.txt         name=et-compromised
https://www.binarydefense.com/banlist.txt                                name=binarydefense
https://blocklist.greensnow.co/greensnow.txt                             name=greensnow

