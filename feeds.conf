# Threat feeds to convert into UniFi-ready lists.
#
# Columns (separated by spaces or tabs):
#   name     output file prefix: lists/<name>-v4.txt and lists/<name>-v6.txt
#   group    which combined list the feed joins:
#              core     high-confidence networks, safe to block in both directions
#              inbound  individual attacking hosts, best blocked inbound only
#              none     published on its own only
#   format   text            one IP or CIDR per line; # and ; comments are ignored
#            range           start IP and end IP as the first two columns (DShield)
#            spamhaus-json   Spamhaus DROP JSON, one object per line
#   url      where to download it
#
# Repeat a name on several lines to merge several URLs into one feed.
# Put a # in front of a line to turn that feed off.

# ---- core: block in both directions ---------------------------------------
spamhaus-drop     core     spamhaus-json  https://www.spamhaus.org/drop/drop_v4.json
spamhaus-drop     core     spamhaus-json  https://www.spamhaus.org/drop/drop_v6.json
firehol-level1    core     text           https://iplists.firehol.org/files/firehol_level1.netset
et-block-ips      core     text           https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt
dshield           core     range          https://feeds.dshield.org/block.txt
feodo-tracker     core     text           https://feodotracker.abuse.ch/downloads/ipblocklist.txt

# ---- inbound: block from the internet only --------------------------------
ipsum-level3      inbound  text           https://raw.githubusercontent.com/stamparm/ipsum/master/levels/3.txt
blocklist-de      inbound  text           https://lists.blocklist.de/lists/all.txt
cins-army         inbound  text           https://cinsscore.com/list/ci-badguys.txt
et-compromised    inbound  text           https://rules.emergingthreats.net/blockrules/compromised-ips.txt
binarydefense     inbound  text           https://www.binarydefense.com/banlist.txt
greensnow         inbound  text           https://blocklist.greensnow.co/greensnow.txt
