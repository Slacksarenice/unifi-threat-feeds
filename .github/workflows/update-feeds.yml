name: Update threat feeds

on:
  schedule:
    # Once a day at 03:17 UTC. Spamhaus asks for no more than one download a
    # day, and UniFi refreshes at most every 24 hours anyway.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - feeds.conf
      - allowlist.txt
      - scripts/**
      - .github/workflows/update-feeds.yml

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build lists
        run: python3 scripts/build_lists.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update threat feeds"
            git push
          fi
